services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    expose:
      - "3000"          # наружу не публикуем — доступ только изнутри
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # target: runner     # если хочешь явно указать stage
    ports:
      - "80:80"          # теперь фронт на 80, а не 5173
    depends_on:
      - backend

volumes:
  pgdata: